api-version: 2024-02-02-preview
location: {{ .Env.AZURE_LOCATION }}
identity:
  type: UserAssigned
  userAssignedIdentities:
    ? "{{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}"
    : {}
properties:
  environmentId: {{ .Env.AZURE_CONTAINER_APPS_ENVIRONMENT_ID }}
  configuration:
    activeRevisionsMode: single
    runtime:
      dotnet:
        autoConfigureDataProtection: true
    ingress:
      external: false
      targetPort: {{ targetPortOrDefault 8080 }}
      transport: http
      allowInsecure: true
    registries:
      - server: {{ .Env.AZURE_CONTAINER_REGISTRY_ENDPOINT }}
        identity: {{ .Env.AZURE_CONTAINER_REGISTRY_MANAGED_IDENTITY_ID }}
    secrets:
      - name: connectionstrings--notificationdiscordbot-kv
        value: '{{ .Env.NOTIFICATIONDISCORDBOT_KV_VAULTURI }}'
      - name: connectionstrings--notificationdiscordbot-kv
        value: '{{ .Env.NOTIFICATIONDISCORDBOT_KV_VAULTURI }}'
  template:
    containers:
      - image: {{ .Image }}
        name: notificationdiscordbot-server
        env:
          - name: AZURE_CLIENT_ID
            value: {{ .Env.MANAGED_IDENTITY_CLIENT_ID }}
          - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
            value: "true"
          - name: HTTP_PORTS
            value: '{{ targetPortOrDefault 0 }}'
          - name: NOTIFICATIONDISCORDBOT_KV_URI
            value: '{{ .Env.NOTIFICATIONDISCORDBOT_KV_VAULTURI }}'
          - name: OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY
            value: in_memory
          - name: ConnectionStrings__notificationdiscordbot-kv
            secretRef: connectionstrings--notificationdiscordbot-kv
          - name: ConnectionStrings__notificationdiscordbot_kv
            secretRef: connectionstrings--notificationdiscordbot-kv

    scale:
      minReplicas: 1
tags:
  azd-service-name: notificationdiscordbot-server
  aspire-resource-name: notificationdiscordbot-server
